<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd166">
<title>¿Dónde está el juguete?</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-180.png">
<link rel="icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juguetes">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="rotate">📱↻<br>Gira el teléfono</div>
<div id="app"><div class="stage" id="stage">

  <section class="screen on" id="home">
    <h1>¿Dónde está el juguete?</h1>
    <img class="hero" src="assets/p_maxi.webp" style="left:-4%" alt="">
    <img class="hero" src="assets/p_rex.webp" style="right:-6%;animation-delay:.6s" alt="">
    <button class="btn" id="play">▶ ¡Jugar!</button>
  </section>

  <section class="screen" id="map">
    <button class="round" id="mapHome" style="top:2%;left:1.5%">🏠</button>
    <h2>Elige un mundo</h2>
    <div class="worlds" id="worlds"></div>
  </section>

  <section class="screen" id="game">
    <img class="bg" id="gbg" alt="">
    <div id="spots"></div>
    <div class="tray" id="tray"></div>
    <button class="round" id="gameBack" style="top:2%;left:1.5%;z-index:8">⬅</button>
    <div class="lvl" id="lvl"></div>
  </section>

  <button class="round" id="mute" style="top:2%;right:1.5%;z-index:9" aria-label="Música">🎵</button>
  <div id="esquina"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/></svg></div>
  <div id="papas"><div class="card">
    <h3>Rincón de los papás</h3>
    <div class="fila">Volumen <input type="range" id="pVol" min="0" max="100" step="5"></div>
    <div class="fila">Música de fondo <button id="pMus"></button></div>
    <div class="fila">Todos los mundos <button id="pAbrir"></button></div>
    <div class="fila">Progreso <button class="rojo" id="pReset">Reiniciar</button></div>
    <div class="pie"><button class="verde" id="pCerrar">Listo</button></div>
  </div></div>
  <canvas id="confetti"></canvas>
  <div id="vid"><video id="video" playsinline preload="auto"></video><button class="round skip" id="skip">⏭</button></div>
</div></div>

<script src="js/comun/progreso.js"></script>
<script src="js/comun/nucleo.js"></script>
<script src="js/comun/personajes.js"></script>
<script src="js/comun/audio.js"></script>
<script src="js/comun/voz.js"></script>
<script src="js/comun/papas.js"></script>
<script src="js/minijuegos/juguetes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
